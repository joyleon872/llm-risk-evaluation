# Nordvik Bank customer assistant – LLM risk evaluation
# Compares a baseline system prompt against a hardened one (added controls)
# on the same 40 test cases.

description: "Nordvik Bank assistant: LLM risk evaluation (baseline vs hardened controls)"

prompts:
  - id: file://prompts/baseline.json
    label: baseline
  - id: file://prompts/hardened.json
    label: hardened

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    label: claude-haiku-4.5
    config:
      temperature: 0
      max_tokens: 600

defaultTest:
  vars:
    docs: file://docs/nordvik_bank_policies.md
  options:
    # Model used to grade the llm-rubric assertions
    provider: anthropic:messages:claude-haiku-4-5-20251001

tests: file://tests.yaml
